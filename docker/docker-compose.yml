# SmartPark Kenya — three services, one image.
#
#   docker compose -f docker/docker-compose.yml up --build
#
# Then:  site http://127.0.0.1:8000 · fee :5000 · barrier :5001
# DATABASE_URL (Supabase) and secrets are read from the project .env file.

name: smartpark

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    env_file: ../.env
    environment:
      FEE_SERVICE_URL: http://fee:5000
      BARRIER_SERVICE_URL: http://barrier:5001
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,0.0.0.0
    ports:
      - "8000:8000"
    depends_on:
      - fee
      - barrier
    volumes:
      # keep demo media (uploads) across rebuilds
      - ../media:/app/media

  fee:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python flask_services/fee_service/app.py
    env_file: ../.env
    environment:
      FLASK_HOST: 0.0.0.0
      FEE_SERVICE_PORT: "5000"
    ports:
      - "5000:5000"

  barrier:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python flask_services/barrier_service/app.py
    env_file: ../.env
    environment:
      FLASK_HOST: 0.0.0.0
      BARRIER_SERVICE_PORT: "5001"
    ports:
      - "5001:5001"
