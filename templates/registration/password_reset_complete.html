{% extends "base.html" %}

{% block title %}Password reset complete{% endblock %}

{% block anonymous %}
<div class="ap-auth-wrap">
  <div class="ap-auth-card">
    <h1 style="font-size:1.125rem; font-weight:650; margin:0 0 0.375rem;">Password updated</h1>
    <p style="font-size:0.875rem; color:var(--ap-muted); margin-bottom:1.25rem;">
      Your password has been changed. You can now sign in.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100">Sign in</a>
  </div>
</div>
{% endblock %}
