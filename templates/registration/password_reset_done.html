{% extends "base.html" %}

{% block title %}Check your email{% endblock %}

{% block anonymous %}
<div class="ap-auth-wrap">
  <div class="ap-auth-card">
    <h1 style="font-size:1.125rem; font-weight:650; margin:0 0 0.375rem;">Check your email</h1>
    <p style="font-size:0.875rem; color:var(--ap-muted);">
      If an account exists with that address, reset instructions have been sent.
      <br><br>
      <em>Development note: emails are printed to the Django console.</em>
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary w-100">Back to sign in</a>
  </div>
</div>
{% endblock %}
