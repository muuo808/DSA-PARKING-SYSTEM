{% extends "base.html" %}

{% block title %}Reset your password{% endblock %}

{% block anonymous %}
<div class="ap-auth-wrap">
  <div class="ap-auth-card">
    <h1 style="font-size:1.125rem; font-weight:650; margin:0 0 0.375rem;">Reset your password</h1>
    <p style="font-size:0.875rem; color:var(--ap-muted); margin-bottom:1.25rem;">
      Enter the email address registered to your account and we'll send reset instructions.
    </p>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="id_email">Email address</label>
        <input type="email" name="email" id="id_email" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Send reset link</button>
    </form>
    <p class="mb-0 mt-3" style="font-size:0.8125rem; text-align:center;">
      <a href="{% url 'accounts:login' %}">Back to sign in</a>
    </p>
  </div>
</div>
{% endblock %}
